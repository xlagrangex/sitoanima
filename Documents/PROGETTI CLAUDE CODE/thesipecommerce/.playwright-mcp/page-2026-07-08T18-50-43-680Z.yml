                  - paragraph [ref=e211]: La sfida più grande sarà sicuramente gestire la logistica della produzione, tra la stampa dei mazzi completi e degli sticker che accompagneranno il progetto, e la logistica delle spedizioni, ma nel corso dei mesi abbiamo acquisito esperienza sotto questo punto di vista e pensiamo di riuscire a far fronte ai rischi che potrebbero presentarsi.
