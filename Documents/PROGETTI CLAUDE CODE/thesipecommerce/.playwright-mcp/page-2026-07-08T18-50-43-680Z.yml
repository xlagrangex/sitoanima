                  - heading "Story" [level=2] [ref=e167]
                  - generic [ref=e170]:
                    - figure [ref=e172]
                    - heading "THE SIP" [level=3] [ref=e173]
                    - heading "The Sea In your Pocket" [level=4] [ref=e174]
                    - paragraph [ref=e175]: 30 carte, 25 artisti differenti
                    - paragraph [ref=e176]: 30 cards, 25 different artists
                    - paragraph [ref=e177]: "!!! CHOOSE BETWEEN THE ITALIAN OR ENGLISH DESCRIPTION !!!"
                    - paragraph [ref=e178]: "Entra nell'affascinante mondo che si cela sotto le onde con The SIP - The Sea In Your Pocket, un set di carte collezionabili illustrate e descritte. Questo progetto unico dà vita alla biologia marina in piccoli e gustosi sorsi (sips): una fusione di arte e scienza realizzata grazie alla collaborazione di 25 talentuosi illustratori e due appassionati biologi marini. Ciascuna delle 30 carte, progettate con cura, svela una meraviglia marina nascosta, da vivaci fondali corallini a misteriosi abitanti delle profondità marine."
                    - paragraph [ref=e179]: Guidati da biologi marini e comunicatori scientifici, queste carte offrono un'esperienza educativa e visivamente straordinaria, perfetta per gli amanti del mare e le menti curiose.
                    - paragraph [ref=e180]: Siamo Manuel e Giuliano, unisciti a noi in questo viaggio attraverso la bellezza e il mistero dell'oceano a portata di mano. Tuffati con noi e diventa parte di questo entusiasmante progetto!
                    - paragraph [ref=e181]: Take a seat and take a SIP!
                    - paragraph [ref=e182]:
                      - text: Step into the captivating world beneath the waves with The SIP - The Sea In Your Pocket, a collection of illustrated and narrated collectible flashcards. This unique project brings marine biology to life in small, bite-sized sips—a fusion of art and science created through the collaboration of 25 talented illustrators and two passionate marine biologists. Each of the 30 carefully designed cards unveils a hidden oceanic wonder, from vibrant coral reefs to mysterious deep-sea creatures.
                      - text: Guided by marine biologists and scientific communicators, these cards offer an educational yet visually stunning experience, perfect for ocean lovers and curious minds alike.
                      - text: We are Manuel and Giuliano, join us on this journey to bring the beauty and mystery of the ocean to your fingertips. Dive in with us and be part of this exciting project!
                      - text: Take a seat and take a SIP!
                    - generic:
                      - figure
                    - paragraph [ref=e183]: "30 cards divided for 3 different themes:"
                    - paragraph [ref=e184]: Interactions - Environments - Adaptations
                    - generic:
                      - figure
                    - paragraph [ref=e185]: Queste carte ci aiuteranno a capire il difficile rapporto che c’è tra l’uomo e gli ambienti marini, è davvero così difficile trattare bene il mare o c’è qualche speranza?
                    - paragraph [ref=e186]: These cards will help us understand the difficult relationship between humans and marine environments. Is it really that hard to take good care of the sea, or is there some hope?
                    - generic:
                      - figure
                    - paragraph [ref=e187]: Molto spesso il mare ci appare come una grande distesa di acqua, priva di carattere, ma anche gli ambienti marini nascondono ecosistemi caratteristici che ospitano una biodiversità molto marcata.
                    - paragraph [ref=e188]: Often, the sea appears to us as a vast expanse of water, lacking character, but marine environments also hide characteristic ecosystems that host a remarkable biodiversity
                    - generic:
                      - figure
                    - paragraph [ref=e189]: Cosa hanno inventato le creature marine per sopravvivere alle sfide nascoste sotto le onde? Tecniche di predazione incredibili, forme corporee uniche, colorazioni mozzafiato e tanto altro ancora da scoprire insieme!
                    - paragraph [ref=e190]: What did sea creatures create to overcome the obstacles that lay beneath the waves?Together, let's uncover amazing predation techniques, unique body shapes, breathtaking colorways, and more!
                    - heading "PREVIEW" [level=3] [ref=e191]
                    - heading "ECCO A VOI LE 6 CARTE ANTEPRIMA CHE ABBIAMO PRODOTTO" [level=4] [ref=e192]
                    - paragraph [ref=e193]: Here the 6 preview cards!
                    - generic:
                      - figure
                    - generic:
                      - figure
                    - paragraph [ref=e194]: "Non possiamo parlare però del presente senza dare un'occhiata al passato del mare, il luogo dove ha avuto origine la vita sul nostro pianeta, per fare ciò abbiamo chiesto una mano ad un'illustratore d'eccezione: Willy Guasti, meglio conosciuto come Zoosparkle realizzerà la 31esima carta del set che avrà un'ambientazione preistorica."
                    - paragraph [ref=e195]: "We cannot talk about the present without taking a look at the past of the sea, the place where life on our planet originated, to do this we asked for a hand to an exceptional illustrator: Willy Guasti, better known as Zoosparkle will make the 31st card of the set that will have a prehistoric setting."
                    - generic:
                      - figure
                    - paragraph [ref=e196]: Saremo guidati dalla piccola Andrea, una bambina super curiosa e piena di energie, che ci aiuterà a capire, attraverso i suoi racconti sul retro delle carte, l’importanza degli ambienti marini.
                    - paragraph [ref=e197]: We will be guided by the little Andrea, a super curious and full of energy girl, who will help us to understand, through her stories on the back of the cards, the importance of marine environments.
                    - generic:
                      - figure
                    - paragraph [ref=e198]: La sua presenza sul retro delle carte vi aiuterà a capire a che profondità ci troviamo.
                    - paragraph [ref=e199]: Her presence on the back of the cards will help you to understand how deep we are.
