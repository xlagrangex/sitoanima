name: MangiarePiano
options:
  bundleIdPrefix: com.bizstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MangiarePiano:
    type: application
    platform: iOS
    sources:
      - path: MangiarePiano
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bizstudio.mangiarepiano
        INFOPLIST_FILE: MangiarePiano/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
  MangiarePianoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MangiarePianoTests
    dependencies:
      - target: MangiarePiano
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bizstudio.mangiarepiano.tests
        GENERATE_INFOPLIST_FILE: YES
